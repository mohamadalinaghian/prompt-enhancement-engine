[package]
name = "pe-context"
version = "0.1.0"
edition = "2021"

[dependencies]
pe-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
walkdir = "2.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.9"
