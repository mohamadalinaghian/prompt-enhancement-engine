[package]
name = "pe-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pe"
path = "src/main.rs"

[dependencies]
pe-core = { path = "../core" }
pe-context = { path = "../context" }
pe-adapters = { path = "../adapters" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
dirs = "5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.9"
